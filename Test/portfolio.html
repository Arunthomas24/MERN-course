<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Portfolio</title>
  <style>
    /* Global styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; line-height: 1.6; scroll-behavior: smooth; }
    header { background: #333; color: #fff; padding: 1rem; position: fixed; width: 100%; top: 0; z-index: 1000; }
    nav ul { display: flex; justify-content: center; list-style: none; }
    nav ul li { margin: 0 15px; }
    nav ul li a { color: #fff; text-decoration: none; transition: color 0.3s; }
    nav ul li a:hover { color: #f39c12; }

    section { padding: 80px 20px; min-height: 100vh; }
    #home { background: #f4f4f4; display: flex; align-items: center; justify-content: center; }
    #about, #projects, #contact { background: #fff; }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .project-card {
      background: #eee;
      padding: 20px;
      border-radius: 8px;
      transition: transform 0.3s, background 0.3s;
    }
    .project-card:hover {
      transform: scale(1.05);
      background: #ddd;
    }

    /* Contact Form */
    form { max-width: 400px; margin: auto; display: flex; flex-direction: column; }
    form input, form textarea {
      margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px;
    }
    form button {
      padding: 10px; background: #333; color: #fff; border: none; cursor: pointer;
      transition: background 0.3s;
    }
    form button:hover { background: #f39c12; }

    /* Responsive Navbar */
    @media (max-width: 600px) {
      nav ul { flex-direction: column; }
      nav ul li { margin: 10px 0; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Sections -->
  <section id="home">
    <h1>Welcome to My Portfolio</h1>
  </section>

  <section id="about">
    <h2>About Me</h2>
    <p>I am a web developer passionate about building responsive and interactive websites.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <div class="projects-grid">
      <div class="project-card">Project 1</div>
      <div class="project-card">Project 2</div>
      <div class="project-card">Project 3</div>
      <div class="project-card">Project 4</div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

</body>
</html>
